<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orrundeep — a classic ASCII dungeon descent</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="description" content="Orrundeep: a free, old-school ASCII roguelike. Twenty levels of a drowned dwarven city, permadeath, unidentified potions, mineral veins, a town with four shops. Plays in the browser, no install.">
<meta property="og:title" content="Orrundeep — a classic ASCII dungeon descent">
<meta property="og:description" content="Old-school ASCII roguelike in the browser. Twenty levels down. Permadeath. No install, no account.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://andreasmaeleng.github.io/orrundeep/screenshot.png">
<meta property="og:url" content="https://andreasmaeleng.github.io/orrundeep/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0a08">
<style>
  html, body { margin: 0; height: 100%; background: #0b0a08; color: #d8d4c8; overflow: hidden; font-family: ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, 'Courier New', monospace; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
  canvas { display: block; image-rendering: pixelated; outline: none; touch-action: manipulation; }
  #pad { display: none; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 4px; user-select: none; -webkit-user-select: none; }
  #pad button { font: 15px ui-monospace, Menlo, Consolas, monospace; min-width: 40px; height: 36px; background: #1c1a15; color: #d8d4c8; border: 1px solid #55524a; border-radius: 4px; }
  #pad button:active { background: #55524a; }
  body.touch #pad { display: flex; }
  body.crt #wrap::after { content: ''; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.16) 3px); }
  noscript { display: block; padding: 2em; }
</style>
</head>
<body class="crt">
<div id="wrap">
  <canvas id="c" tabindex="0" aria-label="Orrundeep game screen"></canvas>
  <div id="pad"></div>
</div>
<noscript>Orrundeep is a browser game and needs JavaScript. It makes no network requests and stores nothing but your save, locally.</noscript>
<script src="game.js"></script>
<script>
'use strict';
const C = OD.C, T = OD.T, W = OD.W, H = OD.H;
const COLS = 102, ROWS = 37, MY = 2, SX = 81;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let cw = 8, ch = 16, fs = 14;
const ui = { mode: 'title', menu: null, text: null, tg: null, look: null, dirCb: null, auto: null, n: 0, hover: '', create: null };
const LS = { save: 'orrundeep.save', scores: 'orrundeep.scores', crt: 'orrundeep.crt' };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
if (store.get(LS.crt) === '0') document.body.classList.remove('crt');
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');

/* ---------- canvas ---------- */
function resize() {
  const dpr = window.devicePixelRatio || 1, pad = document.getElementById('pad');
  const aw = window.innerWidth * dpr, ah = (window.innerHeight - (isTouch ? pad.offsetHeight : 0)) * dpr;
  fs = Math.max(6, Math.floor(Math.min(aw / COLS / 0.6, ah / ROWS / 1.22)));

  cv.width = COLS * cw; cv.height = ROWS * ch; cv.style.width = cv.width / dpr + 'px'; cv.style.height = cv.height / dpr + 'px';
  render();
}
function put(x, y, s, fg, bg, bold) {
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(x * cw, y * ch, cw, ch); }
  if (s === ' ') return; ctx.fillStyle = fg || C.w; ctx.font = (bold ? 'bold ' : '') + fs + "px ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,'Courier New',monospace";
  ctx.fillText(s, x * cw + cw / 2, y * ch + ch / 2 + 1);
}
function text(x, y, s, fg, bg, bold) { for (let i = 0; i < s.length && x + i < COLS; i++) put(x + i, y, s[i], fg, bg, bold); }
function ctext(y, s, fg, bold, x0, w) { text((x0 || 0) + Math.floor(((w || COLS) - s.length) / 2), y, s, fg, null, bold); }
function box(x, y, w, h) { ctx.fillStyle = '#0f0e0b'; ctx.fillRect(x * cw, y * ch, w * cw, h * ch); ctx.strokeStyle = '#8a8578'; ctx.lineWidth = Math.max(1, Math.floor(fs / 10)); ctx.strokeRect(x * cw + cw / 2, y * ch + ch / 2, (w - 1) * cw, (h - 1) * ch); }
function dim(hex, f) { const n = parseInt(hex.slice(1), 16); const r = (n >> 16) * f, g = ((n >> 8) & 255) * f, b = (n & 255) * f; return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')'; }
function wallCol(d) { return d === 0 ? '#9a8f7a' : d <= 5 ? '#8f8674' : d <= 10 ? '#6f8894' : d <= 15 ? '#a8684e' : '#8a6aa8'; }
const TG = ['#', '.', '+', "'", '>', '<', '%', '*', ':', '1', '#'];
function tileLook(g, i) {
  const t = g.map[i];
  if (t === T.WALL || t === T.PERMA) return ['#', wallCol(g.depth)];
  if (t === T.FLOOR) return [g.depth === 0 ? '.' : '.', g.depth === 0 ? '#6f7a4a' : '#77705f'];
  if (t === T.DOOR || t === T.OPEN) return [TG[t], C.br];
  if (t === T.DOWN || t === T.UP) return [TG[t], C.wh];
  if (t === T.VEIN) return ['%', '#7d8a8f'];
  if (t === T.GOLD) return ['*', C.gold];
  if (t === T.RUBBLE) return [':', '#8a8578'];
  if (t === T.SHOP) return [String(g.shopPos[i] + 1), C.gold];
  return ['?', C.w];
}

/* ---------- rendering ---------- */
function render() {
  ctx.fillStyle = '#0b0a08'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (ui.mode === 'title') return drawTitle();
  if (ui.mode === 'create') return drawCreate();
  const g = OD.g; if (!g) return;
  drawMap(g); drawSide(g); drawMsgs(g);
  if (ui.menu) drawMenu(ui.menu);
  if (ui.text) drawText(ui.text);
}
function drawMap(g, fxOn) {
  const p = g.p, vis = OD.vis;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (!g.seen[i]) continue;
    const [s, col] = tileLook(g, i), v = vis[i];
    let fg = v ? col : dim(col, 0.58), glyph = s;
    const tr = g.traps[i]; if (tr && tr.f) { glyph = '^'; fg = v ? C.r : dim(C.r, 0.5); }
    put(x, y + MY, glyph, fg);
  }
  for (const o of g.items) { const i = o.y * W + o.x; if (!g.seen[i]) continue; if (!OD.vis[i] && !o.det && !o.sn) continue; if (OD.vis[i]) o.sn = 1;
    const k = OD.kindOf(o.it), col = OD.itemCol(o.it); put(o.x, o.y + MY, k.ch, OD.vis[i] ? col : dim(col, 0.5), '#0b0a08'); }
  for (const m of g.mons) if (OD.canSee(m)) { const k = OD.MON[m.k]; put(m.x, m.y + MY, k.ch, m.sl ? dim(k.col, 0.75) : k.col, k.fl.indexOf('U') >= 0 ? '#2a1030' : '#0b0a08', true); }
  put(p.x, p.y + MY, '@', C.wh, p.hp < p.mhp * 0.25 ? '#6a1408' : '#0b0a08', true);
  if (ui.tg) { const t = ui.tg.list[ui.tg.idx]; if (t) { const k = OD.MON[t.k]; put(t.x, t.y + MY, k.ch, '#000', C.y, true); } }
  if (ui.look) { const L = ui.look; ctx.strokeStyle = C.y; ctx.lineWidth = 2; ctx.strokeRect(L.x * cw + 1, (L.y + MY) * ch + 1, cw - 2, ch - 2); }
  if (fxOn) for (const f of OD.fx) for (const [x, y] of f.cells) if (OD.vis[y * W + x]) put(x, y + MY, f.ch, f.col, '#0b0a08', true);
}
function bar(x, y, w, v, m, col, label) {
  const f = m > 0 ? Math.max(0, Math.min(1, v / m)) : 0; ctx.fillStyle = '#26231d'; ctx.fillRect(x * cw, y * ch + 2, w * cw, ch - 4);
  ctx.fillStyle = col; ctx.fillRect(x * cw, y * ch + 2, Math.round(w * cw * f), ch - 4); ctext(y, label, C.wh, true, x, w);
}
function drawSide(g) {
  const p = g.p, d = p.d; let y = 0; const L = (s, c, b) => text(SX, y++, s, c || C.w, null, b);
  L(p.name, C.gold, true); L(p.race + ' ' + p.cls, C.gy);
  L('Level ' + p.lvl + (p.lvl < 40 ? '  next ' + Math.max(0, Math.ceil(OD.expFor(p.lvl) - p.exp)) : ''), C.w);
  y++;
  bar(SX, y++, 20, p.hp, p.mhp, p.hp < p.mhp * 0.25 ? '#a02818' : p.hp < p.mhp * 0.5 ? '#a8742a' : '#3f7f3a', 'HP ' + p.hp + '/' + p.mhp);
  if (p.mmp) bar(SX, y++, 20, p.mp, p.mmp, '#2f5fa8', 'MP ' + p.mp + '/' + p.mmp);
  y++;
  L('AC ' + d.ac + '   Gold ' + p.gold, C.w);
  L('Str ' + d.str + '  Dex ' + d.dex, C.gy); L('Con ' + p.st.con + '  Int ' + p.st.int, C.gy);
  y++;
  L(g.depth ? 'Depth ' + g.depth + '  ' + g.depth * 50 + ' ft' : 'Orrun Gate', C.lb, true);
  L('Turn ' + g.turn, C.dg);
  const l = p.eq.light; L(l ? (OD.kindOf(l).art ? 'Light: eternal' : 'Light: ' + l.fuel) : 'No light!', !l || (!OD.kindOf(l).art && l.fuel < 300) ? C.r : C.gy);
  // status
  const st = []; const t = p.t;
  if (p.food < 400) st.push(['Weak', C.r]); else if (p.food < 1500) st.push(['Hungry', C.y]);
  if (t.pois) st.push(['Poisoned', C.g]); if (t.conf) st.push(['Confused', C.y]); if (t.afraid) st.push(['Afraid', C.y]); if (t.haste) st.push(['Fast', C.lb]); if (t.slow) st.push(['Slow', C.r]);
  if (t.hero) st.push(['Hero', C.gold]); if (t.resist) st.push(['Resist', C.lb]); if (t.seeinv) st.push(['TrueSight', C.lb]); if (g.recall) st.push(['Recall', C.p]); if (g.won) st.push(['VICTOR', C.gold]);
  let sx = SX; y++; for (const [s, c] of st) { if (sx + s.length > COLS) { sx = SX; y++; } text(sx, y, s, c, null, true); sx += s.length + 1; } y += 2;
  // visible creatures
  const ms = g.mons.filter(m => OD.canSee(m)).sort((a, b) => Math.max(Math.abs(a.x - p.x), Math.abs(a.y - p.y)) - Math.max(Math.abs(b.x - p.x), Math.abs(b.y - p.y)));
  if (ms.length) { text(SX, y++, 'In view:', C.dg); }
  for (const m of ms) { if (y >= ROWS - 3) { text(SX, y, '...', C.dg); break; } const k = OD.MON[m.k], r = m.hp / m.mhp;
    put(SX, y, k.ch, k.col, null, true); text(SX + 2, y, (m.sl ? 'z ' : '') + k.n.split(',')[0].slice(0, m.sl ? 16 : 18), r > 0.66 ? C.w : r > 0.33 ? C.y : C.r); y++; }
  // footer
  text(0, ROWS - 2, ui.hover || footHint(), C.dg);
  text(0, ROWS - 1, '?:help  z:explore  >:stairs  i:pack  R:rest  Tab:fight  f:fire  m:magic  g:get  S:save', '#3f3c35');
}
function footHint() {
  if (ui.tg) return 'TARGET: Tab/Space next · Enter/f fire · or a direction · Esc cancel';
  if (ui.look) return 'LOOK: move the cursor · Esc to stop';
  if (ui.dirCb) return 'Which direction?';
  return '';
}
function drawMsgs(g) {
  const L = g.msgs.slice(-2);
  if (ui.look) { text(0, 0, OD.describe(ui.look.x, ui.look.y).slice(0, 80), C.y); return; }
  // pack recent messages into two lines
  const recent = g.msgs.filter(m => m.turn >= g.turn - 1).slice(-8), rows = ['', '']; const cols = [[], []]; let r = 0;
  const src = recent.length ? recent : L.slice(-1);
  for (const m of src) { const s = m.t + (m.x ? ' (x' + m.x + ')' : '') + ' '; if (rows[r].length + s.length > 80) { if (r === 0) r = 1; else { rows[0] = rows[1]; cols[0] = cols[1]; rows[1] = ''; cols[1] = []; } }
    cols[r].push([rows[r].length, s.slice(0, 80), recent.length ? m.c : C.dg]); rows[r] += s.slice(0, 80); }
  for (let i = 0; i < 2; i++) for (const [x, s, c] of cols[i]) text(x, i, s, c);
}
function drawMenu(m) {
  const w = Math.min(78, Math.max(m.title.length + 4, ...m.lines.map(l => l.text.length + 6), (m.footer || '').length + 4, 30)), h = m.lines.length + 4 + (m.footer ? 1 : 0);
  const x = Math.floor((W - w) / 2), y = MY + Math.max(0, Math.floor((H - h) / 2));
  box(x, y, w, h); text(x + 2, y + 1, m.title, C.gold, null, true);
  m.rows = {};
  m.lines.forEach((l, i) => { const Y = y + 3 + i; if (l.key) { text(x + 2, Y, l.key + ')', C.y); m.rows[Y] = l.key; } if (l.glyph) put(x + 5, Y, l.glyph, l.gcol, null, true); text(x + (l.key ? (l.glyph ? 7 : 5) : 2), Y, l.text, l.col || C.w); });
  if (m.footer) text(x + 2, y + h - 2, m.footer, C.dg);
}
function drawText(t) {
  box(1, MY, W - 2, H); const per = H - 4; t.per = per; const max = Math.max(0, t.lines.length - per); if (t.off > max) t.off = max; if (t.off < 0) t.off = 0;
  for (let i = 0; i < per; i++) { const l = t.lines[t.off + i]; if (l === undefined) break; const s = typeof l === 'string' ? l : l[0], c = typeof l === 'string' ? C.w : l[1]; text(3, MY + 1 + i, s.slice(0, W - 6), c); }
  text(3, MY + H - 2, (t.footer || '') + (max ? '  ↑/↓ PgUp/PgDn scroll' : '') + (t.dead ? '' : '  Esc: close'), C.dg);
}
const LOGO = String.raw`
  ___  ____  ____  _   _ _   _ ____  _____ _____ ____
 / _ \|  _ \|  _ \| | | | \ | |  _ \| ____| ____|  _ \
| | | | |_) | |_) | | | |  \| | | | |  _| |  _| | |_) |
| |_| |  _ <|  _ <| |_| | |\  | |_| | |___| |___|  __/
 \___/|_| \_\_| \_\\___/|_| \_|____/|_____|_____|_|`.split('\n').slice(1);
function drawTitle() {
  const x0 = Math.floor((COLS - 53) / 2); LOGO.forEach((l, i) => text(x0, 4 + i, l, i < 2 ? C.gold : i < 4 ? C.o : C.r, null, true));
  ctext(10, 'a classic ASCII dungeon descent', C.gy);
  const lore = ['Two hundred years ago the dwarves of Orrun dug too greedily beneath the sea,', 'and the sea came in. Their king would not leave his hall. He is down there still —',
    'twenty levels and a thousand feet below the Gate, wearing a crown of drowned gold.', '', 'Go down. Bring it back. Try not to die on the stairs.'];
  lore.forEach((l, i) => ctext(13 + i, l, i === 4 ? C.w : '#a8a294'));
  const has = !!store.get(LS.save); let y = 21;
  const opt = (k, s, on) => { ctext(y++, '[' + k + '] ' + s, on === false ? C.dg : C.w, true); };
  opt('N', 'New descent      ', true); opt('C', 'Continue         ', has); opt('D', 'Daily seed       ', true); opt('H', 'Hall of the dead ', true); opt('?', 'How to play      ', true);
  ctext(28, 'Permadeath · 20 levels · 4 races · 4 classes · 12 spells · 59 creatures · town & shops', C.dg);
  ctext(30, 'Keyboard: arrows / numpad / hjklyubn.   F2 toggles scanlines.   No ads, no tracking, no account.', C.dg);
  if (ui.confirmNew) ctext(26, 'A saved descent exists. Press Y to abandon it, any other key to keep it.', C.y, true);
  const u = new URLSearchParams(location.search).get('seed'); if (u) ctext(32, 'Seed from link: "' + u + '" — press N to play it.', C.lb);
  ctext(ROWS - 2, 'v1.1 · MIT licence · source on GitHub', '#3f3c35');
}
function drawCreate() {
  const c = ui.create; ctext(3, 'A NEW DESCENT', C.gold, true); let y = 6;
  const list = (title, obj, sel, active) => { text(8, y++, title, active ? C.y : C.dg, null, true); y++;
    Object.keys(obj).forEach((k, i) => { const on = sel === k; text(10, y, String.fromCharCode(97 + i) + ') ' + k.padEnd(10), on ? C.gold : active ? C.w : C.dg, null, on); text(26, y, obj[k].desc, on ? C.w : C.dg); y++; }); y++; };
  list('Choose your people', OD.RACES, c.race, c.step === 0); list('Choose your calling', OD.CLASSES, c.cls, c.step === 1);
  text(8, y++, 'Name', c.step === 2 ? C.y : C.dg, null, true); y++;
  text(10, y, c.name + (c.step === 2 ? '_' : ''), C.wh, null, true); y += 2;
  text(8, y++, 'Seed: "' + c.seed + '"' + (c.daily ? '  (today\'s daily — same dungeon for everyone)' : ''), C.dg);
  ctext(ROWS - 3, c.step < 2 ? 'Press a–d to choose.  Esc: back' : 'Type a name, Enter to begin.  Esc: back', C.gy);
}

/* ---------- persistence ---------- */
function persist() { const g = OD.g; if (g && !g.dead) store.set(LS.save, OD.save()); }
function scores() { try { return JSON.parse(store.get(LS.scores) || '[]'); } catch (e) { return []; } }
window.addEventListener('beforeunload', persist); document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });

/* ---------- flow ---------- */
function stopAuto() { ui.auto = null; }
function auto(step) { ui.auto = step; const tick = () => { if (ui.auto !== step) return; let ok = false; try { ok = step(); } catch (e) { console.error(e); } after(true); if (ok && ui.auto === step && ui.mode === 'play' && !ui.menu) setTimeout(tick, 14); else if (ui.auto === step) ui.auto = null; }; tick(); }
function after(quiet) {
  const g = OD.g; if (!g) return;
  if (g.event && g.event.shop !== undefined) { const s = g.event.shop; g.event = null; stopAuto(); openShop(s); }
  if (g.ask) { stopAuto(); askIdentify(); }
  if (g.crownHome && !g.dead) OD.retire();
  if (g.dead) { stopAuto(); return onDeath(); }
  if (g.autosave || ++ui.n % 25 === 0) { g.autosave = 0; persist(); }
  render();
  if (OD.fx.length && !quiet) { drawMap(g, true); const n = ++ui.fxn; setTimeout(() => { if (ui.fxn === n) { OD.fx.length = 0; render(); } }, 130); }
}
ui.fxn = 0;
function doAct(fn) { OD.act(fn); after(); }
function onDeath() {
  const g = OD.g; ui.menu = null; ui.tg = null; ui.look = null;
  if (!g.recorded) { g.recorded = 1; const S = scores(); S.push({ s: OD.score(), n: g.p.name, r: g.p.race, c: g.p.cls, l: g.p.lvl, d: g.maxDepth, dd: g.dead.depth, w: g.dead.retired ? 1 : 0, cr: g.crownHome ? 1 : 0, by: g.dead.retired ? '' : OD.withArticle(g.dead.cause), seed: g.seed, t: Date.now() }); S.sort((a, b) => b.s - a.s); store.set(LS.scores, JSON.stringify(S.slice(0, 15))); store.del(LS.save); }
  const won = g.dead.retired; const art = won ? ['       .   *   .', '    *   \\  |  /   *', '   --   VICTORY   --', '    *   /  |  \\   *', '       .   *   .'] :
    ['        _________', '       /         \\', '      /   R.I.P.  \\', '      |           |', '      |           |', '     _|___________|_'];
  const lines = art.map(a => [a, won ? C.gold : C.gy]).concat([''], OD.morgue().split('\n').map((l, i) => [l, i === 0 ? C.gold : i === 1 ? (won ? C.gold : C.r) : C.w]));
  ui.mode = 'play'; ui.text = { lines, off: 0, footer: 'C: copy to clipboard   Shift+N or Enter: new game', dead: true, t0: Date.now() }; render();
}
function shareText() { const g = OD.g; return OD.morgue() + '\n\nPlay the same dungeon: ' + location.origin + location.pathname + '?seed=' + encodeURIComponent(g.seed); }
function copy(s) { if (navigator.clipboard) navigator.clipboard.writeText(s).then(() => flash('Copied to clipboard.'), () => flash('Copy failed.')); else flash('Clipboard not available.'); }
function flash(s) { ui.hover = s; render(); setTimeout(() => { ui.hover = ''; render(); }, 1500); if (ui.text) { ui.text.footer = s + '   C: copy   Shift+N or Enter: new game'; render(); } }

/* ---------- menus ---------- */
function openMenu(title, lines, onKey, footer) { ui.menu = { title, lines, onKey, footer }; render(); }
function closeMenu() { ui.menu = null; render(); }
function itemLine(it, key) { const k = OD.kindOf(it); return { key, glyph: k.ch, gcol: OD.itemCol(it), text: OD.itemName(it), col: it.cursed && it.idd ? C.r : k.art ? C.gold : it.ego ? C.lb : C.w }; }
function chooseItem(prompt, filter, cb, empty) {
  const g = OD.g, inv = g.p.inv, idx = []; inv.forEach((it, i) => { if (!filter || filter(it)) idx.push(i); });
  if (!idx.length) return say(empty || 'You have nothing suitable.');
  const lines = idx.map(i => itemLine(inv[i], String.fromCharCode(97 + i)));
  openMenu(prompt, lines, k => { const i = k.length === 1 ? k.charCodeAt(0) - 97 : -1; if (idx.indexOf(i) >= 0) { closeMenu(); cb(i); } return true; }, 'Esc: cancel');
}
function showInv() {
  const g = OD.g, inv = g.p.inv; const lines = inv.length ? inv.map((it, i) => itemLine(it, String.fromCharCode(97 + i))) : [{ text: 'Your pack is empty.', col: C.gy }];
  openMenu('Pack (' + inv.length + '/23)', lines, k => { const i = k.length === 1 ? k.charCodeAt(0) - 97 : -1; if (inv[i]) { closeMenu(); itemActions(i); } return true; }, 'Pick an item for actions · Esc: close');
}
function itemActions(i) {

  if (ui.tg) { const m = ui.tg.list.find(m => m.x === tx && m.y === ty), t = ui.tg; ui.tg = null; return t.cb(m ? { x: m.x, y: m.y } : { x: tx, y: ty }); }
  if (ui.dirCb) { const cb = ui.dirCb; ui.dirCb = null; if (tx === p.x && ty === p.y) return render(); return cb(Math.sign(tx - p.x), Math.sign(ty - p.y)); }
  if (tx === p.x && ty === p.y) return key('g');
  if (Math.max(Math.abs(tx - p.x), Math.abs(ty - p.y)) <= 1) return doAct(() => OD.move(tx - p.x, ty - p.y));
  auto(() => OD.goStep(tx, ty));
});
cv.addEventListener('wheel', e => { if (ui.text) { ui.text.off += e.deltaY > 0 ? 3 : -3; render(); e.preventDefault(); } }, { passive: false });
/* touch pad */
(function () {
  const pad = document.getElementById('pad');
  const B = [['7', '↖'], ['8', '↑'], ['9', '↗'], ['z', 'explore'], ['Tab', 'fight'], ['g', 'get'], ['i', 'pack'], ['4', '←'], ['5', '·'], ['6', '→'], ['>', '>'], ['<', '<'], ['R', 'rest'], ['f', 'fire'], ['1', '↙'], ['2', '↓'], ['3', '↘'], ['m', 'magic'], ['e', 'equip'], ['Enter', 'ok'], ['Escape', 'esc'], ['?', '?'], ['n', 'N'], ['c', 'C'], ['a', 'a'], ['b', 'b'], ['d', 'd'], ['y', 'y'], ['Q', 'retire']];
  for (const [k, label] of B) { const b = document.createElement('button'); b.textContent = label; b.addEventListener('click', e => { e.preventDefault(); try { key(k, false); } catch (err) { console.error(err); } }); pad.appendChild(b); }
})();
window.addEventListener('resize', resize);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
resize(); cv.focus();
